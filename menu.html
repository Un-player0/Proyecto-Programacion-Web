  <!-- CONTENIDO PRINCIPAL -->
  <main>
     
    <!-- SECCIÓN: ENTRADAS -->
    <section id="entradas">
      <h2>Entradas</h2>
      <div id="cards-container">

        <article>
          <button>
          <h3>Causa</h3>
          <p>Incluye salsa huancaína.</p>
          <p>S/ 14</p>
          </button>
        </article>
  
        <article>
          <button>
          <h3>Chorizo casero</h3>
          <p>3 chorizos caseros</p>
          <p>S/ 12</p>
          </button>
        </article>
  
        <article>
          <button>
          <h3>Tequeños de queso</h3>
          <p>6 tequeños rellenos de queso con crema de palta.</p>
          <p>S/ 16</p>
          </button>
        </article>

      </div>
      <hr/>
    </section>
 
    <!-- SECCIÓN: ANTICUCHOS -->
    <section id="anticucho">
      <h2>Anticuchos</h2>
      <div id="cards-container">

        <article>
          <button>
          <h3>Anticucho de corazón Clásico</h3>
          <p>Corazón de res marinado en ají panca, vinagre y comino. Servido con choclo y papa sancochada.</p>
          <p>S/ 18</p>
          </button>
        </article>
  
        <article>
          <button>
          <h3>Anticucho mixto</h3>
          <p>Combinación de corazón, pollo y chorizo especial. Acompañado de salsa criolla y ají amarillo.</p>
          <p>S/ 24</p>
          </button>
        </article>
  
        <article>
          <button>
          <h3>Anticucho de pollo</h3>
          <p>Pechuga de pollo en marinada de ají amarillo y limón. Suave, jugoso y muy aromático.</p>
          <p>S/ 16</p>
          </button>
        </article>

      </div>
      <hr/>
    </section>
 
    <!-- SECCIÓN: CARNES A LA PARRILLA -->
    <section id="parrilla">
      <h2>Carnes a la Parrilla</h2>
      <div id="cards-container">
 
      <article>
        <button>
        <h3>Churrasco de res <span>Favorito</span></h3>
        <p>Corte jugoso de 300 g, a la brasa de carbón. Con papas fritas o arroz y ensalada fresca.</p>
        <p>S/ 38</p>
        </button>
      </article>
 
      <article>
        <button>
        <h3>Filete Mignon de Pechuga</h3>
        <p>Carne tierna y sabrosa. Se prepara envolviendo pechugas en tiras de tocino y champiñones.</p>
        <p>S/ 40</p>
        </button>
      </article>
 
      <article>
        <button>
        <h3>Chuleta de cerdo</h3>
        <p>Chuleta gruesa glaseada en miel de caña y mostaza. Con camote al horno y chimichurri.</p>
        <p>S/ 32</p>
        </button>
      </article>
 
      <article>
        <button>
        <h3>Bife de Chorizo Argentino</h3>
        <p>Carne de chorizo argentiniana, jugosa y sabrosa. Se prepara a la parrilla con hierbas aromáticas.</p>
        <p>S/ 35</p>
        </button>
      </article>
      <hr/>
    </section>
 
    <!-- SECCIÓN: COMBOS -->
    <section id="combos">
      <h2>Combos </h2>
      <div id="cards-container">
 
      <article>
        <button>
        <h3>Combo Personal</h3>
        <ul>
          <li>2 anticuchos de corazón</li>
          <li>Choclo y papas</li>
          <li>Salsa de la casa</li>
          <li>Gaseosa personal</li>
        </ul>
        <p>S/ 35</p>
        </button>
      </article>
 
      <article>
        <button>
        <h3>Parrilla para dos</h3>
        <ul>
          <li>1 churrasco de res</li>
          <li>3 anticuchos mixtos</li>
          <li>1 guarnición incluida</li>
          <li>Gaseosa personal (x2)</li>
        </ul>
        <p>S/ 75</p>
        </button>
      </article>
 
      <article>
        <button>
        <h3>Combo Familiar</h3>
        <ul>
          <li>6 anticuchos de corazón</li>
          <li>2 churrascos de res</li>
          <li>1 chuleta de cerdo</li>
          <li>1 guarnición incluida</li>
          <li>Gaseosa o chicha o limonada 1.5 L</li>
        </ul>
        <p>S/ 110</p>
        </button>
      </article>
      </div>
      <hr/>
    </section>
 
    <!-- SECCIÓN: BEBIDAS -->
    <section id="bebidas">
      <h2>Bebidas</h2>
      <div id="cards-container">
 
      <article>
        <button>
        <h3>Chicha morada o Limonada 1L</h3>
        <p>S/ 8</p>
        </button>
      </article>

      <article>
        <button>
        <h3>Chicha morada o Limonada 1.5L</h3>
        <p>S/ 11s</p>
        </button>
      </article>

      <article>
        <button>
        <h3>Pisco sour</h3>
        <p>S/ 18</p>
        </button>
      </article>
 
      <article>
        <button>
        <h3>Gaseosa 1.5L</h3>
        <p>S/ 14</p>
        </button>
      </article>
 
      <article>
        <button>
        <h3>Gaseosa personal</h3>
        <p>S/ 5</p>
        </button>
      </article>
 
      <article>
        <button>
        <h3>Cerveza Pilsen 630ml</h3>
        <p>S/ 9</p>
        </button>
      </article>
      </div>
    </section>
 
  </main>
