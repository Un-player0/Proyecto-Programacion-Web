<body>
  <!-- ENCABEZADO -->
  <header>
    <div class="navbar-area">
      <section class="container">
        <nav class="navbar contain">
          <a href="index.html" class="nav-logo"><img src="images/logo_dark.png" alt="Black Angus Logo" height="70"/></a>

      </section>
    </div>
  </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main>
        <div id="reservas">
        <h2> RESERVAS </h2>
            <div id="reservas-form">
                <div id="reservas-form-local">
                    <label for="cars">Escoge un local:</label>

                    <select name="cars" id="cars">
                        <option value="miraflores">Miraflores</option>
                        <option value="sanisidro">San Isidro</option>
                        <option value="surco">Surco</option>
                        <option value="jockeyplaza">Jockey Plaza</option>
                    </select>
                </div>

                <div id="reservas-form-fecha">
                    <label for="fecha">Fecha de reserva:</label>
                    <input type="date" id="fecha" name="fecha" value=""/>
                </div>

                <div id="reservas-form-hora">
                    <label for="hora">Hora de reserva:</label>
                    <input type="time" id="hora" name="hora" min="8:00" max="22:00"/>
                </div>
                
                <div id="reservas-form-personas">
                    <label for="personas">Número de personas:</label>
                    <input type="number" id="personas" name="personas" value="1" min="1" max="20"/>
                </div>
                <button id="reservas-form-submit">Realizar Reserva</button>

            </div>
        </div>
    </main>

    <!-- PIE DE PÁGINA -->
    <footer>
    <div class="footer-about">
      <nav class="footer-nav contain">
        <input type="checkbox" id="footer-nav-toggle" class="footer-nav-toggle" />

        </ul>
      </nav>
    </div>
    <p class="copyright">© 2026 Black Angus House - Todos los derechos reservados</p>
  </footer>
