<body>
  <!-- ENCABEZADO -->
  <header>
    <div class="navbar-area">
      <section class="container">
        <nav class="navbar contain">
          <a href="index.html" class="nav-logo"><img src="images/logo_dark.png" alt="Black Angus Logo" height="70"/></a>
          <input type="checkbox" id="nav-toggle" class="nav-toggle" />
          <label for="nav-toggle" class="nav-hamburger" aria-label="Abrir menú">
            <span></span>
            <span></span>
            <span></span>
          </label>
            <ul class="nav-links">
              <li><a href="menu.html">Menu</a></li>
              <li><a href="locales.html">Locales</a></li>
              <li><a href="nosotros.html">Acerca de nosotros</a></li>
              <li><a href="reservar.html">Realizar una reserva</a></li>
              <li><a href="login.html">Ingresar</a></li>
            </ul>
        </nav>
      </section>
    </div>
  </header>

    <!-- CONTENIDO PRINCIPAL -->
  <main>
    <!-- LOGIN -->
    <section id="form-login">
      <h2>Iniciar sesión</h2>

      <button class="btn google">Continuar con Google</button>
      <form>
        
        <label for="login-email">Correo electrónico</label>
        <input
          type="email"
          id="login-email"
          name="email"
          placeholder="correo@ejemplo.com"
          required
        />

        <label for="login-password">Contraseña</label>
        <input
          type="password"
          id="login-password"
          name="password"
          placeholder="Tu contraseña"
          required
        />

        <a href="#recuperar">¿Olvidaste tu contraseña?</a>

        <button class="btn" type="submit">Ingresar</button>

      </form>
    </section>


    <!-- SIGNUP -->
    <section id="form-signup">
      <h2>Crear cuenta</h2>
      <form>
        <label for="signup-name">Nombre completo</label>
        <input
          type="text"
          id="signup-name"
          name="name"
          placeholder="Juan Pérez"
          required
        />

        <label for="signup-email">Correo electrónico</label>
        <input
          type="email"
          id="signup-email"
          name="email"
          placeholder="correo@ejemplo.com"
          required
        />

        <label for="signup-phone">Teléfono (opcional)</label>
        <input
          type="tel"
          id="signup-phone"
          name="phone"
          placeholder="+51 999 999 999"
        />

        <label for="signup-password">Contraseña</label>
        <input
          type="password"
          id="signup-password"
          name="password"
          placeholder="Mínimo 8 caracteres"
          minlength="8"
          required
        />

        <label for="signup-confirm">Confirmar contraseña</label>
        <input
          type="password"
          id="signup-confirm"
          name="confirm"
          placeholder="Repite tu contraseña"
          minlength="8"
          maxlength="16"
          required
        />

        <label>
          <input type="checkbox" name="terms" required />
          Acepto los <a href="terminos.html" target="_blank">términos y condiciones</a>
        </label>

        <button class="btn" type="submit">Crear cuenta</button>

      </form>
    </section>

  </main>

    <!-- PIE DE PÁGINA -->

    <div class="footer-about">

            <li><a href="https://forms.gle/2TB8Co67aePxxZjV9" target="_blank"><img src="images/complain_book.png" alt="Libro de reclamaciones" width="100vw"/></a></li>
        </ul>
      </nav>
    </div>
    <p class="copyright">© 2026 Black Angus House - Todos los derechos reservados</p>
  </footer>
</body>
</html>
